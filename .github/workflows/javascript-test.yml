---
name: JavaScript Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Cache node modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
            pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Run pnpm install
        run: |
          pnpm install --frozen-lockfile

      - name: Run pnpm run test
        run: |
          pnpm run test
