---
name: JavaScript Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Enable corepack
        run: corepack enable

      - name: Cache node modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
            pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Run pnpm install
        run: |
          pnpm install --frozen-lockfile

      - name: Run pnpm run lint
        run: |
          pnpm run lint

      - name: Run pnpm run format:check
        run: |
          pnpm run format:check

      - name: Run pnpm run typecheck
        run: |
          pnpm run typecheck
