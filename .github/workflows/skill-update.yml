---
name: Skill Update

on:
  schedule:
    - cron: "0 0 * * 0" # Sunday 09:00 JST (Sunday 00:00 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Update skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh skill update --all

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          # git diff --quiet は untracked ファイル(新規スキル追加など)を検知できないため
          # git status --porcelain で判定する
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APPS_PULL_REQUEST_CREATE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APPS_PULL_REQUEST_CREATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push branch
        if: steps.diff.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          branch="skill-update/auto"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add -A
          git commit -m "chore(skills): gh skill update --all を実行"

          remote_url="https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"

          # actions/checkout は対象ブランチを fetch しないため、リモート追跡ブランチがなく
          # --force-with-lease 単体では「リモートに未存在であること」を期待してしまい、
          # 2 回目以降の実行(既にブランチが存在する)で必ず失敗する。
          # ls-remote で現在の SHA を取得し、期待値として明示することで
          # 初回・2 回目以降のどちらでも安全な compare-and-swap にする。
          current_remote_sha=$(git ls-remote "$remote_url" "refs/heads/${branch}" | cut -f1)
          git push "$remote_url" "${branch}:${branch}" --force-with-lease="${branch}:${current_remote_sha}"

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BODY: |
            ## 概要

            `gh skill update --all` を実行してスキルを最新バージョンに自動更新しました。

            ## 変更内容

            - 各スキルの `version` および `metadata` フィールドを最新版に更新

            ## 確認手順

            - [ ] 各 SKILL.md のバージョン差分が意図したものか確認する
            - [ ] 動作確認が必要なスキルについてローカルでテストする
        run: |
          set -euo pipefail

          branch="skill-update/auto"

          existing_pr=$(
            gh pr list \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number // ""'
          )

          if [[ -n "$existing_pr" ]]; then
            echo "PR #${existing_pr} already exists for ${branch}; branch updated via force-with-lease."
          else
            gh pr create \
              --title "chore(skills): gh skill update --all を実行" \
              --body "$PR_BODY" \
              --head "$branch" \
              --base main
          fi
