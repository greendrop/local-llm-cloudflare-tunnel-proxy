---
# Cloudflare Workers へ手動でデプロイする
#
# デプロイ先はリポジトリの Secrets で指定する
# - CLOUDFLARE_API_TOKEN: Cloudflare API トークン
# - CLOUDFLARE_ACCOUNT_ID: デプロイ先アカウント ID
# - CLOUDFLARE_WORKER_NAME: デプロイ先 Worker 名
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Enable corepack
        run: corepack enable

      - name: Cache node modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
            pnpm-node_modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Run pnpm install
        run: |
          pnpm install --frozen-lockfile

      - name: Run pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_WORKER_NAME}" ]; then
            echo "::error::Secret CLOUDFLARE_WORKER_NAME が未設定です" >&2
            exit 1
          fi
          pnpm run deploy --name "${CLOUDFLARE_WORKER_NAME}"
